name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs on every push/PR. Lightweight on purpose: numpy + gymnasium + scipy +
  # pytest only, no simulator/rendering/torch stack. Every test file in this repo
  # guards its heavy imports with `pytest.importorskip("mani_skill")` before
  # anything else is imported (verified 2026-08-02: no test file imports
  # torch/sapien/open_clip before that guard), so without mani_skill
  # installed those files skip cleanly instead of erroring -- only the
  # promoted, simulator-independent core (tests/drafts/test_oracle_feasibility.py,
  # testing src/atr/language/goal_graph.py + src/atr/feasibility/oracle.py)
  # actually runs and gates merges. This is the reliable, always-green check.
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: pip install numpy gymnasium scipy pytest
      - name: Install atr package (editable)
        run: pip install -e .
      - name: Run simulator-independent tests
        run: pytest tests/ -v

  # Full suite against the real ManiSkill3/SAPIEN stack. Four deterministic
  # file shards run in parallel: the first observed hosted run spent roughly
  # 37 minutes on setup, then its original 45-minute job budget expired after
  # only 7m47s of tests. Sharding gives every test a bounded route to execute
  # while preserving one sequential pytest process per runner for simulator
  # stability. Keep this non-blocking until every hosted shard is observed.
  full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    env:
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for ReplicaCAD assets
        # ReplicaCADRearrange downloads a 1.38 GiB archive and temporarily
        # needs room for both that archive and its extracted 33k files.
        # ubuntu-latest ships several large SDKs this project never uses.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Vulkan (for SAPIEN's renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Locate the lavapipe (software) Vulkan ICD
        # GitHub-hosted runners have no GPU. Force SAPIEN to use Mesa's
        # CPU-backed Vulkan implementation instead of probing for NVIDIA.
        # The exact filename/path has drifted across mesa-vulkan-drivers
        # versions before (confirmed 2026-08-04: 25.2.8-0ubuntu0.24.04.2 no
        # longer ships it at the previously-hardcoded
        # /usr/share/vulkan/icd.d/lvp_icd.x86_64.json), so find it instead
        # of hardcoding a path that can silently go stale again.
        run: |
          icd=$(find /usr/share/vulkan/icd.d -iname '*lvp*' -o -iname '*llvmpipe*' | head -n1)
          test -n "$icd" || { echo "::error::no lavapipe/llvmpipe ICD found under /usr/share/vulkan/icd.d"; find /usr/share/vulkan/icd.d -type f; exit 1; }
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
      - name: Verify the software Vulkan renderer
        run: vulkaninfo --summary
      - name: Install pinned dependencies (excluding the self-referencing editable line)
        run: |
          grep -v '^-e ' requirements-maniskill.lock.txt > /tmp/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements.txt
      - name: Install atr package (editable)
        run: python -m pip install -e .
      - name: Download required ManiSkill scene assets
        run: |
          df -h /
          python -m mani_skill.utils.download_asset ycb -y
          python -m mani_skill.utils.download_asset ReplicaCAD -y
          python -m mani_skill.utils.download_asset ReplicaCADRearrange -y
          test -f "$HOME/.maniskill/data/assets/mani_skill2_ycb/info_pick_v0.json"
          df -h /
      - name: Verify ManiSkill imports
        run: |
          python -c "import mani_skill, sapien, torch; print('ManiSkill/SAPIEN/Torch imports OK')"
      - name: Run full test suite shard ${{ matrix.shard-index }}
        run: >-
          python scripts/run_test_shard.py
          --shard-index "${{ matrix.shard-index }}" --shard-count 4 -v
