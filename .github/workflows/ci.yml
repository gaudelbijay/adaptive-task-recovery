name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs on every push/PR. Lightweight on purpose: numpy + gymnasium + pytest
  # only, no simulator/rendering/torch stack. Every test file in this repo
  # guards its heavy imports with `pytest.importorskip("mani_skill")` before
  # anything else is imported (verified 2026-08-02: no test file imports
  # torch/sapien/open_clip before that guard), so without mani_skill
  # installed those files skip cleanly instead of erroring -- only the
  # promoted, simulator-independent core (tests/drafts/test_oracle_feasibility.py,
  # testing src/atr/language/goal_graph.py + src/atr/feasibility/oracle.py)
  # actually runs and gates merges. This is the reliable, always-green check.
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: pip install numpy gymnasium pytest
      - name: Install atr package (editable)
        run: pip install -e .
      - name: Run simulator-independent tests
        run: pytest tests/ -v

  # Full suite against the real ManiSkill3/SAPIEN stack -- NOT verified to
  # pass on GitHub-hosted runners as of this writing (2026-08-02). Locally
  # this needs a pinned pyenv virtualenv (ai-notes/decisions.md D-009) and
  # takes ~7-8 minutes with real physics/rendering; whether SAPIEN's
  # headless-Vulkan rendering path works unmodified on a GPU-less
  # ubuntu-latest runner is genuinely untested from this environment, not
  # assumed to work. continue-on-error so a real infrastructure gap here
  # doesn't block merges on the reliable fast-checks job above -- remove
  # that once a real run has actually been observed to pass or fail here.
  full-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    env:
      # GitHub-hosted runners have no GPU. Force SAPIEN to use Mesa's
      # CPU-backed Vulkan implementation instead of probing for NVIDIA.
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Vulkan (for SAPIEN's renderer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Verify the software Vulkan renderer
        run: |
          test -f "$VK_ICD_FILENAMES"
          vulkaninfo --summary
      - name: Install pinned dependencies (excluding the self-referencing editable line)
        run: |
          grep -v '^-e ' requirements-maniskill.lock.txt > /tmp/requirements.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements.txt
      - name: Install atr package (editable)
        run: python -m pip install -e .
      - name: Download required ManiSkill scene assets
        run: |
          python -m mani_skill.utils.download_asset ReplicaCAD -y
          python -m mani_skill.utils.download_asset ReplicaCADRearrange -y
      - name: Verify ManiSkill imports
        run: |
          python -c "import mani_skill, sapien, torch; print('ManiSkill/SAPIEN/Torch imports OK')"
      - name: Run full test suite
        run: python -m pytest tests/ -v
